        <div class="container contact-page">
            <h1>Contact Us</h1>
            <p>This is our contact page</p>
            <form action="">
                <input type="text" placeholder="Full Name" name="name" required>
                <input type="email" placeholder="Email Address" name="email" maxlength="50" required>
                <input type="tel" placeholder="Phone Number" name="phone" maxlength="10" pattern="[0-9]{10}" required>
                <input type="text" placeholder="Subject Line" name="subject" required>
                <textarea placeholder="Your Message" name="message" rows="5" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </div>
